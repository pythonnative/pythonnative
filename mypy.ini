[mypy]
python_version = 3.13
ignore_missing_imports = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = False
strict_optional = False
pretty = True
files = src, tests, examples
# Standalone example apps share the top-level package name `app`. Check the
# reference app separately; whole-tree mode cannot resolve duplicate packages.
exclude = (^build/|^examples/.*/build/|^examples/(e2e-suite|inbox)/)
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-pythonnative.*]
implicit_reexport = True
disable_error_code = attr-defined,no-redef

[mypy-pythonnative.native_views]
disable_error_code = misc

[mypy-pythonnative.native_views.*]
disable_error_code = misc
