# Pre-flow recovery: clear anything a failed previous attempt left
# above the app before the next flow (or a retry of the same flow)
# starts.
#
# Suites wrap every flow in a ``retry`` whose first command runs this
# helper. The Maestro iOS driver occasionally injects a tap that never
# lands (or lands twice) when the CI simulator is starved for CPU, and
# a flow that dies mid-demo can strand a native alert or action sheet
# above the screen. Those float over everything, so no later tap can
# land until they're dismissed; ``open_demo``'s state machine handles
# every other stranding (wrong screen, dead app) on its own.
#
# On a clean run nothing below matches and this helper is a no-op.
appId: ${APP_ID}
---
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
