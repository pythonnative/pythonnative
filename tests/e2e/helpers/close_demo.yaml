# Reusable cleanup: pop from a demo screen back to its category list.
#
# Each flow ends with this helper so the next flow's ``open_demo.yaml``
# can pick up from a known state. ``open_demo`` is state-aware and will
# handle category-to-category or home-to-category transitions itself,
# so this helper only needs to take a single step out of the demo;
# the suite stays in the category screen between consecutive demos in
# the same category, which is most of the suite by volume and the main
# source of the suite-wide speedup.
#
# Callers pass:
#
#     CATEGORY: "Components"
#
# The ``Demos in ${CATEGORY}`` assertion catches a broken "Back to list"
# button right here, with a clear error, instead of letting the failure
# surface as a confusing scroll-not-found in the next flow's
# ``open_demo``.
#
# iOS preserves a parent ScrollView's offset across navigation, so the
# category title can start above the visible fold after returning from
# a deep demo; we scroll up to it before asserting.
appId: ${APP_ID}
---
# A tall demo (or a short viewport: small AVDs with a software navbar)
# can leave "Back to list" below the fold; surface it before tapping.
# No-op when the button is already visible.
- scrollUntilVisible:
    element:
      text: "Back to list"
    direction: DOWN
    timeout: 30000
    optional: true
- tapOn: "Back to list"
# Give the pop time to land before deciding anything else. On a slow
# CI simulator several seconds can pass between the tap landing and
# the demo screen actually popping; concluding "dropped tap" too
# early and re-tapping would pop a second level (demo -> category ->
# home) and strand the suite on the home screen. ``optional`` keeps a
# genuinely dropped tap (element still visible at timeout) from
# failing the helper; the retry below handles it.
- extendedWaitUntil:
    notVisible: "Back to list"
    timeout: 15000
    optional: true
# Scrolling back to the top can take many swipes after a deep demo, and
# a badly lagging emulator can compress one of those swipes into a
# stray tap that opens another demo mid-scroll. Wrap the scroll in a
# retry whose first commands pop any accidentally-opened demo and
# recover from an accidental double-pop to the home screen.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "Back to list"
          commands:
            - tapOn: "Back to list"
            - extendedWaitUntil:
                notVisible: "Back to list"
                timeout: 15000
      # A re-tap that raced a slow pop lands us on the home screen;
      # re-enter the category so the exit assertion below holds.
      - runFlow:
          when:
            visible: "E2E Suite home"
          commands:
            - scrollUntilVisible:
                element:
                  text: "Open ${CATEGORY}"
                direction: DOWN
                timeout: 45000
            - tapOn: "Open ${CATEGORY}"
            - extendedWaitUntil:
                visible: "Demos in ${CATEGORY}"
                timeout: 15000
      - scrollUntilVisible:
          element:
            text: "Demos in ${CATEGORY}"
          direction: UP
          timeout: 45000
          waitToSettleTimeoutMs: 500
      - assertVisible: "Demos in ${CATEGORY}"
