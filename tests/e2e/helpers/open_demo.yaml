# Reusable navigation helper: get the app to ``"Demo: <DEMO_TITLE>"``
# from whatever screen we happen to be on.
#
# Callers pass two env vars:
#
#     CATEGORY: "Hooks"
#     DEMO_TITLE: "use_state"
#
# This helper is *state-aware*: it does the minimum work needed to land
# on the target demo. The full suite spends most of its time replaying
# the same launch + nav-home + nav-category dance between every flow,
# so the suite-wide speedup from short-circuiting these steps is
# significant (and it removes a lot of ``launchApp`` calls, which is
# where Maestro's iOS XCUITest driver tends to flake).
#
# State machine, evaluated top-to-bottom; each block runs only if the
# previous one's effects still leave us off-target:
#
#   1. On a demo screen ("Back to list" visible)
#      -> tap "Back to list", now on some category screen.
#   2. On the wrong category screen ("Back to home" visible, but title
#      != ``Demos in ${CATEGORY}``)
#      -> tap "Back to home", now on the home screen.
#   3. App is dead (neither right category nor home visible)
#      -> ``launchApp``, now on the home screen.
#   4. On the home screen (but not yet on the right category)
#      -> tap ``Open ${CATEGORY}``, now on the right category screen.
#   5. On the right category screen
#      -> tap ``Open: ${DEMO_TITLE}``, now on the target demo.
#
# Both the home and category screens use a ScrollView and the target
# button can be below the visible fold (Components has 20+ demos).
# Maestro's ``tapOn`` does not auto-scroll, so we ``scrollUntilVisible``
# before each tap. iOS also preserves a ScrollView's offset across
# navigation, so we scroll UP to surface the title before asserting.
appId: ${APP_ID}
---
# 1. If we landed on a demo screen, pop one level to its category list.
# Confirm the pop by waiting for ``Back to list`` to disappear rather
# than for the category's ``Back to home`` button to appear: Android
# resets the category ScrollView's offset to the top after navigation,
# so ``Back to home`` (at the bottom of the category list) starts
# below the visible fold and isn't a reliable post-tap signal. iOS
# preserves the offset so the latter would work there, but the
# former works on both.
- runFlow:
    when:
      visible: "Back to list"
    commands:
      - tapOn: "Back to list"
      - extendedWaitUntil:
          notVisible: "Back to list"
          timeout: 15000

# 2. If we're on the wrong category, go back to home. We gate on the
# category title (``Demos in ...``) being visible rather than the
# ``Back to home`` button: Android resets the category ScrollView's
# offset to the top after navigation, so ``Back to home`` (at the
# bottom of the list) starts off-screen and isn't a reliable signal.
# The title is at the top of the scroll content and ``close_demo``
# always scrolls back to it before exiting, so it's visible on both
# platforms when the next flow's ``open_demo`` runs.
#
# The tap is wrapped in a retry because Maestro's iOS driver can drop
# a tap on a slow CI simulator (the tap "lands" but the app never
# navigates); the inner gate re-taps only if we're still on a
# category screen, so a flaked home assertion alone doesn't re-tap.
- runFlow:
    when:
      visible:
        text: "Demos in .*"
      notVisible: "Demos in ${CATEGORY}"
    commands:
      - retry:
          maxRetries: 2
          commands:
            - runFlow:
                when:
                  visible:
                    text: "Demos in .*"
                commands:
                  - scrollUntilVisible:
                      element:
                        text: "Back to home"
                      direction: DOWN
                      timeout: 45000
                  - tapOn: "Back to home"
            - scrollUntilVisible:
                element:
                  text: "E2E Suite home"
                direction: UP
                timeout: 15000
            - assertVisible: "E2E Suite home"

# 3. If neither the right category nor the home screen is visible, the
# app is either not running yet (first flow of the suite) or the driver
# lost its connection. Relaunch as a cold start.
- runFlow:
    when:
      notVisible: "Demos in ${CATEGORY}"
    commands:
      - runFlow:
          when:
            notVisible: "E2E Suite home"
          commands:
            - launchApp
            - extendedWaitUntil:
                visible: "E2E Suite home"
                timeout: 60000

# 4. From the home screen, navigate into the right category. Retried
# for the same dropped-tap reason as step 2: the inner gate re-taps
# only while we're still on the home screen.
- runFlow:
    when:
      visible: "E2E Suite home"
      notVisible: "Demos in ${CATEGORY}"
    commands:
      - retry:
          maxRetries: 2
          commands:
            - runFlow:
                when:
                  visible: "E2E Suite home"
                  notVisible: "Demos in ${CATEGORY}"
                commands:
                  - scrollUntilVisible:
                      element:
                        text: "Open ${CATEGORY}"
                      direction: DOWN
                      timeout: 45000
                  - tapOn: "Open ${CATEGORY}"
            - extendedWaitUntil:
                visible: "Demos in ${CATEGORY}"
                timeout: 15000

# 5. We're now guaranteed to be on the right category list. Open the
# requested demo. The Components category has ~28 rows, so reaching the
# deepest demos takes many swipes; give the scroll a generous budget
# for slow (software-rendered) emulators, and let the UI settle between
# swipes so a laggy emulator doesn't compress a swipe into a stray tap
# on one of the list's buttons.
#
# A stray tap can still slip through on a badly lagging emulator and
# open the wrong demo mid-scroll, which would otherwise strand the
# scroll loop on a demo screen. Wrap the whole step in a retry whose
# first command pops any accidentally-opened demo, so a second attempt
# starts from the category list again.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "Back to list"
          commands:
            - tapOn: "Back to list"
            - extendedWaitUntil:
                notVisible: "Back to list"
                timeout: 15000
      - scrollUntilVisible:
          element:
            text: "Open: ${DEMO_TITLE}"
          direction: DOWN
          timeout: 60000
          waitToSettleTimeoutMs: 500
      - tapOn:
          text: "Open: ${DEMO_TITLE}"
      - extendedWaitUntil:
          visible: "Demo: ${DEMO_TITLE}"
          timeout: 15000
