# Component category suite, second half (B); see components.yaml.
#
# The components category is large enough (28 flows) that a single
# GitHub-hosted Android emulator session can't reliably finish it: the
# emulator grows unstable after ~15 minutes of sustained Maestro
# driving and drops offline around the ~26th flow. CI therefore runs
# the category as two halves, each on a freshly booted emulator.
#
# Usage:
#     maestro test tests/e2e/suites/components-b.yaml -e APP_ID=com.pythonnative.e2e
appId: ${APP_ID}
---
- retry:
    maxRetries: 2
    commands:
      - runFlow: ../helpers/recover.yaml
      - runFlow: ../flows/components/refresh_control.yaml
- retry:
    maxRetries: 2
    commands:
      - runFlow: ../helpers/recover.yaml
      - runFlow: ../flows/components/fragment.yaml
- retry:
    maxRetries: 2
    commands:
      - runFlow: ../helpers/recover.yaml
      - runFlow: ../flows/components/portal.yaml
- retry:
    maxRetries: 2
    commands:
      - runFlow: ../helpers/recover.yaml
      - runFlow: ../flows/components/error_boundary.yaml
- retry:
    maxRetries: 2
    commands:
      - runFlow: ../helpers/recover.yaml
      - runFlow: ../flows/components/spacer.yaml
- retry:
    maxRetries: 2
    commands:
      - runFlow: ../helpers/recover.yaml
      - runFlow: ../flows/components/status_bar.yaml
- retry:
    maxRetries: 2
    commands:
