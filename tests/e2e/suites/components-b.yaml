# Component category suite, part 2 of three; see components.yaml.
#
# The components category is large enough (35 flows) that a single
# GitHub-hosted Android emulator session can't reliably finish it: the
# emulator grows unstable after roughly ten minutes of sustained Maestro
# driving and drops offline mid-flow. CI therefore runs the category as
# three parts of about twelve flows, each on a freshly booted emulator.
#
# Usage:
#     maestro test tests/e2e/suites/components-b.yaml -e APP_ID=com.pythonnative.e2e
appId: ${APP_ID}
---
- runFlow: ../flows/components/safe_area_view.yaml
- runFlow: ../flows/components/modal.yaml
- runFlow: ../flows/components/pressable.yaml
- runFlow: ../flows/components/picker.yaml
- runFlow: ../flows/components/refresh_control.yaml
- runFlow: ../flows/components/fragment.yaml
- runFlow: ../flows/components/portal.yaml
- runFlow: ../flows/components/error_boundary.yaml
- runFlow: ../flows/components/spacer.yaml
- runFlow: ../flows/components/status_bar.yaml
- runFlow: ../flows/components/keyboard_avoiding_view.yaml
- runFlow: ../flows/components/flat_list.yaml
- runFlow: ../flows/components/accessibility_props.yaml
