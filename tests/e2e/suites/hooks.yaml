# Hooks category suite: Maestro entry-point for hook-only runs.
#
# Usage:
#     maestro test tests/e2e/suites/hooks.yaml -e APP_ID=com.pythonnative.e2e
#
# The flow list lives in hooks-a.yaml and hooks-b.yaml; this file just
# chains the parts. CI runs the parts as separate Android shards (a
# GitHub-hosted emulator can't survive all 26 flows in one session),
# while iOS simulators and local runs can use this aggregate directly.
appId: ${APP_ID}
---
- runFlow: hooks-a.yaml
- runFlow: hooks-b.yaml
