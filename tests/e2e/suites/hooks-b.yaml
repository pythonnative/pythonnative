# Hooks category suite, part 2 of two; see hooks.yaml.
#
# The hooks category (26 flows) takes a GitHub-hosted Android emulator
# past its stable session length: the emulator drops offline after
# roughly ten minutes of sustained Maestro driving. CI therefore runs the
# category as two parts, each on a freshly booted emulator.
#
# Usage:
#     maestro test tests/e2e/suites/hooks-b.yaml -e APP_ID=com.pythonnative.e2e
appId: ${APP_ID}
---
- runFlow: ../flows/hooks/use_transition.yaml
- runFlow: ../flows/hooks/use_deferred_value.yaml
- runFlow: ../flows/hooks/use_query.yaml
- runFlow: ../flows/hooks/use_mutation.yaml
- runFlow: ../flows/hooks/use_persisted_state.yaml
- runFlow: ../flows/hooks/use_window_dimensions.yaml
- runFlow: ../flows/hooks/memo.yaml
- runFlow: ../flows/hooks/batch_updates.yaml
- runFlow: ../flows/hooks/use_color_scheme.yaml
- runFlow: ../flows/hooks/use_theme.yaml
- runFlow: ../flows/hooks/use_locales.yaml
- runFlow: ../flows/hooks/use_reduce_motion.yaml
- runFlow: ../flows/hooks/use_screen_reader_enabled.yaml
