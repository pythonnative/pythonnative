# Component category suite, part 3 of three; see components.yaml.
#
# The components category is large enough (35 flows) that a single
# GitHub-hosted Android emulator session can't reliably finish it: the
# emulator grows unstable after roughly ten minutes of sustained Maestro
# driving and drops offline mid-flow. CI therefore runs the category as
# three parts of about twelve flows, each on a freshly booted emulator.
#
# Usage:
#     maestro test tests/e2e/suites/components-c.yaml -e APP_ID=com.pythonnative.e2e
appId: ${APP_ID}
---
- runFlow: ../flows/components/section_list.yaml
- runFlow: ../flows/components/web_view.yaml
- runFlow: ../flows/components/web_view_handle.yaml
- runFlow: ../flows/components/touchable_opacity.yaml
- runFlow: ../flows/components/image_background.yaml
- runFlow: ../flows/components/linear_gradient.yaml
- runFlow: ../flows/components/blur_view.yaml
- runFlow: ../flows/components/checkbox.yaml
- runFlow: ../flows/components/segmented_control.yaml
- runFlow: ../flows/components/date_picker.yaml
- runFlow: ../flows/components/suspense.yaml
- runFlow: ../flows/components/lazy.yaml
