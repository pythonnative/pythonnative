# Gestures category suite: Maestro entry-point for gesture-only runs.
#
# Usage:
#     maestro test tests/e2e/suites/gestures.yaml -e APP_ID=com.pythonnative.e2e
appId: ${APP_ID}
---
- retry:
    maxRetries: 2
    commands:
      - runFlow: ../helpers/recover.yaml
      - runFlow: ../flows/gestures/gestures.yaml
