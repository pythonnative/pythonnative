# Motion category suite. The file keeps the name ``animations`` because
# scripts/run-e2e.sh and the CI shards in .github/workflows/e2e.yml
# select it by that name.
appId: ${APP_ID}
---
- runFlow: ../flows/motion/with_timing.yaml
- runFlow: ../flows/motion/easing.yaml
- runFlow: ../flows/motion/with_spring.yaml
- runFlow: ../flows/motion/with_decay.yaml
- runFlow: ../flows/motion/composition.yaml
- runFlow: ../flows/motion/interpolate.yaml
- runFlow: ../flows/motion/collapsing_header.yaml
- runFlow: ../flows/motion/drag_under_load.yaml
- runFlow: ../flows/motion/layout_animations.yaml
- runFlow: ../flows/motion/list_item_animations.yaml
- runFlow: ../flows/motion/shared_element.yaml
- runFlow: ../flows/motion/bottom_sheet.yaml
- runFlow: ../flows/motion/swipeable.yaml
- runFlow: ../flows/motion/frame_callback.yaml
