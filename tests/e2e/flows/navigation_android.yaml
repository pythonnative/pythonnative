appId: ${APP_ID}
---
# Navigate Home -> Showcase -> Forms and back on Android.
- launchApp
- extendedWaitUntil:
    visible: "Hello from PythonNative Demo!"
    timeout: 30000
- tapOn: "View Showcase"
- extendedWaitUntil:
    visible: "Greetings from Home"
    timeout: 10000
- scroll
- scroll
- extendedWaitUntil:
    visible: "View Forms"
    timeout: 10000
- tapOn: "View Forms"
- assertVisible: "Forms"
- assertVisible: "You navigated two levels deep."
- back
- extendedWaitUntil:
    visible: "Greetings from Home"
    timeout: 10000
