# Tests Animated.parallel composes timing + spring concurrently.
#
# Demo screen: examples/e2e-suite/app/screens/animations/parallel_animation.py
# Source under test: src/pythonnative/animated.py :: Animated.parallel
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Animations
      DEMO_TITLE: Animated.parallel
- assertVisible: "Status: idle"
- tapOn: "Run parallel"
- extendedWaitUntil:
    visible: "Status: done"
    timeout: 10000
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Animations
