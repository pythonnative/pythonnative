appId: ${APP_ID}
---
# Switch to the Layout screen and verify the flex / aspect-ratio /
# absolute-positioning demos all render after the layout pass.
- launchApp
- extendedWaitUntil:
    visible: "Hello from PythonNative Demo!"
    timeout: 30000
- tapOn: "Layout"
- extendedWaitUntil:
    visible: "Flex layout"
    timeout: 10000
- assertVisible: "flex: 1"
- assertVisible: "Aspect ratio"
- assertVisible: "1:1"
- assertVisible: "16:9"
- assertVisible: "Absolute positioning"
- assertVisible: "top-left"
- assertVisible: "top-right"
- assertVisible: "bottom-left"
- assertVisible: "bottom-right"
- assertVisible: "centered"
