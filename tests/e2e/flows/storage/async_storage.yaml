# Tests AsyncStorage write / read / delete round-trip. Each async op
# flips the readout on *completion* ("(written)" / "(cleared)"), and the
# flow waits for that transition before tapping the next button — taps
# must not race the storage I/O on slow CI runners.
#
# Demo screen: examples/e2e-suite/app/screens/storage/async_storage_demo.py
# Source under test: src/pythonnative/storage.py :: AsyncStorage
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Storage
      DEMO_TITLE: AsyncStorage
- tapOn: "Clear"
- extendedWaitUntil:
    visible: "Read value: (cleared)"
    timeout: 5000
- tapOn: "Write"
- extendedWaitUntil:
    visible: "Read value: (written)"
    timeout: 5000
- tapOn: "Read"
- extendedWaitUntil:
    visible: "Read value: stored-value"
    timeout: 5000
- tapOn: "Clear"
- extendedWaitUntil:
    visible: "Read value: (cleared)"
    timeout: 5000
- tapOn: "Read"
- extendedWaitUntil:
    visible: "Read value: (none)"
    timeout: 5000
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Storage
