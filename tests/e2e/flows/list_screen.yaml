appId: ${APP_ID}
---
# Switch to the List screen and verify the virtualized FlatList renders rows.
- launchApp
- extendedWaitUntil:
    visible: "Hello from PythonNative Demo!"
    timeout: 30000
- tapOn: "List"
- extendedWaitUntil:
    visible: "Row 1"
    timeout: 10000
- assertVisible: "Row 1"
- assertVisible: "Row 2"
- assertVisible: "Row 3"
- scroll
- scroll
- scroll
