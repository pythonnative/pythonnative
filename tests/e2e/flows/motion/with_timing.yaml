# Tests with_timing awaited from Python: a fade that finishes reports
# True, and one interrupted by a plain write reports False.
#
# Demo screen: examples/e2e-suite/app/screens/motion/with_timing.py
# Source under test: src/pythonnative/motion/animations.py :: with_timing
#                    src/pythonnative/motion/shared.py :: SharedValue.animate
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Motion
      DEMO_TITLE: with_timing
- assertVisible: "Status: idle"
- tapOn: "Run timing"
- extendedWaitUntil:
    visible: "Status: done"
    timeout: 5000
- assertVisible: "Finished: yes"
- tapOn: "Interrupt timing"
- extendedWaitUntil:
    visible: "Status: interrupted"
    timeout: 5000
- assertVisible: "Finished: no"
- tapOn: "Reset"
- extendedWaitUntil:
    visible: "Status: idle"
    timeout: 5000
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Motion
