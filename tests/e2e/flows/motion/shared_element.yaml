# Tests a shared-element push and pop on the root stack: a tile with
# shared_tag flies into the hero of the pushed screen and back.
#
# Demo screen: examples/e2e-suite/app/screens/motion/shared_element.py
# Source under test: src/pythonnative/motion/transitions.py :: SharedTransition
#                    src/pythonnative/components/props.py :: MotionProps (shared_tag)
#
# Maestro can't see the flight itself; it asserts that the push and the
# pop both land with their content, which a broken flight (a hidden
# source, a hero left in the overlay) would not.
#
# The flow doesn't cover the interactive back swipe on iOS. XCTest's
# synthesized touches don't count as screen-edge touches on the
# simulator, so neither UIKit's back swipe nor the shared-element edge
# pan starts. On iOS 26 the full-width content swipe is off while the
# screens share elements, so a mid-screen swipe doesn't pop either.
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Motion
      DEMO_TITLE: Shared element
- assertVisible: "Showing: list"
- assertVisible: "Thumb"
- tapOn: "Open detail"
- extendedWaitUntil:
    visible: "Showing: detail"
    timeout: 5000
- assertVisible: "Hero tile"
- tapOn: "Back to list"
- extendedWaitUntil:
    visible: "Showing: list"
    timeout: 5000
- assertVisible: "Thumb"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Motion
