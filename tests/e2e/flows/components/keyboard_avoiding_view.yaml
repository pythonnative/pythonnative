# Tests KeyboardAvoidingView renders its body without crashing.
#
# Demo screen: examples/e2e-suite/app/screens/components/keyboard_avoiding_view.py
# Source under test: src/pythonnative/components.py :: KeyboardAvoidingView
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Components
      DEMO_TITLE: KeyboardAvoidingView
- assertVisible: "KAV body label"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Components
