# Tests Modal opens and closes on demand.
#
# Demo screen: examples/e2e-suite/app/screens/components/modal.py
# Source under test: src/pythonnative/components.py :: Modal
#
# The intermediate ``Modal: open`` text from the outer screen is
# *not* asserted while the modal is presented; on iOS the modal
# sheet covers the outer screen so its accessibility elements are
# offscreen for the duration. Instead we verify the toggle by
# checking that ``Modal body text`` becomes / stops being visible
# and that the outer state returns to ``Modal: closed`` after dismiss.
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Components
      DEMO_TITLE: Modal
- assertVisible: "Modal: closed"
- assertVisible: "Show count: 0"
- tapOn: "Open modal"
- extendedWaitUntil:
    visible: "Modal body text"
    timeout: 10000
- tapOn: "Close modal"
- extendedWaitUntil:
    notVisible: "Modal body text"
    timeout: 10000
- assertVisible: "Modal: closed"
# on_show fired exactly once during the presentation above.
- assertVisible: "Show count: 1"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Components
