# Tests SegmentedControl selection from real segment taps and buttons.
#
# Real segments are tapped first ("Two", "Three": segment titles are
# accessibility elements on iOS and Button text on Android), which
# exercises the native value-changed wiring that the Pick buttons
# bypass entirely.
#
# Demo screen: examples/e2e-suite/app/screens/components/segmented_control.py
# Source under test: src/pythonnative/components.py :: SegmentedControl
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Components
      DEMO_TITLE: SegmentedControl
- assertVisible: "Selected: One"
# Real interaction: tap the segments themselves.
- tapOn: "Two"
- assertVisible: "Selected: Two"
- tapOn: "Three"
- assertVisible: "Selected: Three"
# Programmatic path: buttons drive the same selection.
- tapOn: "Pick One"
- assertVisible: "Selected: One"
- tapOn: "Pick Two"
- assertVisible: "Selected: Two"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Components
