# Tests pn.lazy suspends until its loader resolves, then renders the loaded component.
#
# Demo screen: examples/e2e-suite/app/screens/components/lazy_component.py
# Source under test: src/pythonnative/suspense.py :: lazy
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Components
      DEMO_TITLE: lazy
- extendedWaitUntil:
    visible: "Widget: loaded"
    timeout: 8000
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Components
