# Tests Fragment merges its children into the parent.
#
# Demo screen: examples/e2e-suite/app/screens/components/fragment.py
# Source under test: src/pythonnative/components/structural.py :: Fragment
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Components
      DEMO_TITLE: Fragment
- assertVisible: "Fragment line 1"
- assertVisible: "Fragment line 2"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Components
