# Tests Image renders without crashing alongside its labels.
#
# Demo screen: examples/e2e-suite/app/screens/components/image.py
# Source under test: src/pythonnative/components/media.py :: Image
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Components
      DEMO_TITLE: Image
- assertVisible: "Tiles rendered: 3"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Components
