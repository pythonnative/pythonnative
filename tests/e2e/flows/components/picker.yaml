# Tests Picker selection through the real control and via buttons.
#
# The real picker is opened first; tapping the control (its title is
# the selected label, "Apple") presents the native chooser (action
# sheet on iOS, Spinner dropdown on Android); tapping "Banana" selects
# it. This exercises the native open/select event wiring that the
# Pick buttons bypass entirely.
#
# Demo screen: examples/e2e-suite/app/screens/components/picker.py
# Source under test: src/pythonnative/components.py :: Picker
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Components
      DEMO_TITLE: Picker
- assertVisible: "Picked: apple"
# Real interaction: open the native picker and choose an option.
- tapOn: "Apple"
- extendedWaitUntil:
    visible: "Banana"
    timeout: 10000
- tapOn: "Banana"
- extendedWaitUntil:
    visible: "Picked: banana"
    timeout: 10000
    optional: true
# On a slow CI simulator a delayed duplicate tap can land on the
# picker control (whose title is now also "Banana") and reopen the
# chooser; its scrim hides the result line from Maestro. Dismiss it
# before asserting.
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
      - extendedWaitUntil:
          notVisible: "Cancel"
          timeout: 10000
- extendedWaitUntil:
    visible: "Picked: banana"
    timeout: 10000
# Programmatic path: buttons drive the same value.
- tapOn: "Pick cherry"
- assertVisible: "Picked: cherry"
- tapOn: "Pick apple"
- assertVisible: "Picked: apple"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Components
