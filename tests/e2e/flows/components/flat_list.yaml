# Tests FlatList virtualizes rows; scrolling reveals later rows.
# With a fixed item_height the demo takes the native virtualization
# path (RecyclerView / UITableView with nested-reconciler rows), so
# this flow exercises native cell recycling end to end.
#
# Demo screen: examples/e2e-suite/app/screens/components/flat_list.py
# Source under test: src/pythonnative/components/lists.py :: FlatList, _NativeList
#
# The demo sizes the FlatList (~400 dp) so it overlaps the vertical
# center of the screen on both the iOS and Android CI emulators,
# letting us use Maestro's standard ``scrollUntilVisible`` (which
# swipes from the screen center). See ``components/scroll_view.yaml``
# for the full rationale.
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Components
      DEMO_TITLE: FlatList
- assertVisible: "FlatRow 1"
# Target the *last* row. Virtualized rows exist in the accessibility
# tree only while on screen, and one Maestro fling can travel several
# hundred points between visibility polls, so a mid-list target (say
# row 20 of 100) can be recycled away between polls and never observed
# -- the scroll then sails to the bottom and times out. The last row
# cannot be overshot. The generous timeout and settle pause absorb the
# slow CI simulator, where each poll re-snapshots the hierarchy.
- scrollUntilVisible:
    element: "FlatRow 40"
    direction: DOWN
    timeout: 45000
    waitToSettleTimeoutMs: 500
    visibilityPercentage: 100
    centerElement: false
- assertVisible: "FlatRow 40"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Components
