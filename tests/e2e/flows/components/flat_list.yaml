# Tests FlatList renders and scrolls vertically and horizontally, and that
# the inverted variant honors initial_scroll_index (rows separated by an
# item_separator element in every mode).
#
# Demo screen: examples/e2e-suite/app/screens/components/flat_list.py
# Source under test: src/pythonnative/components/lists.py :: FlatList
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Components
      DEMO_TITLE: FlatList
- assertVisible: "Mode: vertical"
- assertVisible: "FlatRow 1"
# Target the *last* row. Virtualized rows exist in the accessibility
# tree only while on screen, and one Maestro fling can travel several
# hundred points between visibility polls, so a mid-list target (say
# row 20 of 100) can be recycled away between polls and never observed
# -- the scroll then sails to the bottom and times out. The last row
# cannot be overshot. The generous timeout and settle pause absorb the
# slow CI simulator, where each poll re-snapshots the hierarchy.
- scrollUntilVisible:
    element: "FlatRow 40"
    direction: DOWN
    timeout: 45000
    waitToSettleTimeoutMs: 500
    visibilityPercentage: 100
    centerElement: false
- assertVisible: "FlatRow 40"
# Horizontal rows are wider than vertical row heights. Use a faster native
# fling and allow the greater travel distance to the same final row.
# On a short screen the page scrolls on once the list reaches its end,
# which takes the "Mode" readout above the list off-screen, so the rows
# show each switch instead: only the inverted list opens on row 21 (its
# initial index), and only the new horizontal list starts back at row 1.
- tapOn: "Show inverted list"
- extendedWaitUntil:
    visible: "FlatRow 21"
    timeout: 10000
# Horizontal last: a vertical swipe passes through a horizontal list, so
# close_demo can still scroll the page to "Back to list". A vertical list
# fills the middle of a short screen and would take those swipes itself.
- tapOn: "Show horizontal list"
- extendedWaitUntil:
    visible: "FlatRow 1"
    timeout: 10000
- scrollUntilVisible:
    element: "FlatRow 40"
    direction: RIGHT
    speed: 80
    timeout: 90000
    waitToSettleTimeoutMs: 500
    visibilityPercentage: 100
    centerElement: false
- assertVisible: "FlatRow 40"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Components
