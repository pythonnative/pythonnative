# Tests TextInput: typing into a single-line input mirrors into the echo line.
#
# Demo screen: examples/e2e-suite/app/screens/components/text_input.py
# Source under test: src/pythonnative/components.py :: TextInput
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Components
      DEMO_TITLE: TextInput
- assertVisible: "Echo: (empty)"
- assertVisible: "Focused: OFF"
- tapOn: "Type your name here"
# on_focus fires when the field becomes first responder / gains focus.
- assertVisible: "Focused: ON"
- inputText: "Maestro"
- assertVisible: "Echo: Maestro"
# Maestro's ``hideKeyboard`` is unreliable on iOS 26+ (it looks for a
# UI dismiss button that doesn't exist for a standard text keyboard).
# ``pressKey: Enter`` works because the iOS handler installs a
# ``UITextFieldDelegate.textFieldShouldReturn:`` that resigns first
# responder, which is also the behavior most users expect.
- pressKey: Enter
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Components
