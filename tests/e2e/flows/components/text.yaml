# Tests Text element renders multiple variants in one screen.
#
# Demo screen: examples/e2e-suite/app/screens/components/text.py
# Source under test: src/pythonnative/components.py :: Text
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Components
      DEMO_TITLE: Text
- assertVisible: "Plain text line"
- assertVisible: "Bold text line"
- assertVisible: "Sized and colored line"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Components
