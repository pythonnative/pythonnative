# Tests DatePicker updates its bound value when a button sets it programmatically.
#
# Known coverage gap, accepted deliberately: the *native* picker UI is
# not driven here. Opening it presents a calendar popover (iOS compact
# style) or a date dialog (Android) whose internals differ per
# platform and OS version, making day-cell taps too brittle for a
# shared flow. The control's value-changed wiring uses the same raw
# target-action plumbing as Switch/SegmentedControl, which *are*
# covered by direct interaction in their flows.
#
# Demo screen: examples/e2e-suite/app/screens/components/date_picker.py
# Source under test: src/pythonnative/components.py :: DatePicker
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Components
      DEMO_TITLE: DatePicker
- assertVisible: "Date: 2026-01-01"
- tapOn: "Set 2026-12-25"
- assertVisible: "Date: 2026-12-25"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Components
