# Tests Pressable on_press fires and increments the counter.
#
# Demo screen: examples/e2e-suite/app/screens/components/pressable.py
# Source under test: src/pythonnative/components.py :: Pressable
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Components
      DEMO_TITLE: Pressable
- assertVisible: "Presses: 0"
- tapOn: "Tap me (Pressable)"
- assertVisible: "Presses: 1"
- tapOn: "Tap me (Pressable)"
- assertVisible: "Presses: 2"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Components
