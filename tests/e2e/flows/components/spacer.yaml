# Tests Spacer renders and labels remain visible around it.
#
# Demo screen: examples/e2e-suite/app/screens/components/spacer.py
# Source under test: src/pythonnative/components.py :: Spacer
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Components
      DEMO_TITLE: Spacer
- assertVisible: "Spacer top label"
- assertVisible: "Spacer bottom label"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Components
