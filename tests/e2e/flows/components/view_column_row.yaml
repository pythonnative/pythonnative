# Tests View / Column / Row render their children, scrolling to the lower
# column tiles and generic View on smaller viewports.
#
# Demo screen: examples/e2e-suite/app/screens/components/view_column_row.py
# Source under test: src/pythonnative/components/layout.py :: View, Column, Row
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Components
      DEMO_TITLE: View / Column / Row
- assertVisible: "A"
- assertVisible: "B"
- assertVisible: "C"
- assertVisible: "X"
- assertVisible: "Y"
- scrollUntilVisible:
    element:
      text: "Z"
    direction: DOWN
    timeout: 20000
- assertVisible: "Z"
- scrollUntilVisible:
    element:
      text: "inside View"
    direction: DOWN
    timeout: 20000
- assertVisible: "inside View"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Components
