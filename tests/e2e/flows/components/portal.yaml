# Tests Portal floats children over the screen with live state/events.
#
# Demo screen: examples/e2e-suite/app/screens/components/portal.py
# Source under test: src/pythonnative/reconciler.py :: Portal
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Components
      DEMO_TITLE: Portal
- assertVisible: "Banner shown: no"
- assertNotVisible: "Floating banner (count 0)"
- tapOn: "Show banner"
- assertVisible: "Banner shown: yes"
- assertVisible: "Floating banner (count 0)"
# Events inside the portal stay wired to the screen's state.
- tapOn: "Bump from portal"
# A slow CI simulator can swallow the tap (the button gets the
# touch-down but never the release). Give the bump time to render,
# then re-tap once if the count never moved.
- extendedWaitUntil:
    visible: "Floating banner (count 1)"
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible: "Floating banner (count 1)"
    commands:
      - tapOn: "Bump from portal"
- extendedWaitUntil:
    visible: "Floating banner (count 1)"
    timeout: 10000
- assertVisible: "Portal count: 1"
- tapOn: "Hide banner"
- assertNotVisible: "Floating banner (count 1)"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Components
