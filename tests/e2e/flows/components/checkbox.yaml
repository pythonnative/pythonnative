# Tests Checkbox flips between ON and OFF.
#
# The native box is tapped directly (via its "Accept" label) before
# the proxy buttons: the direct tap exercises the platform's toggle
# event wiring (raw target-action on iOS, OnCheckedChangeListener on
# Android), which the buttons bypass entirely.
#
# Demo screen: examples/e2e-suite/app/screens/components/checkbox.py
# Source under test: src/pythonnative/components/controls.py :: Checkbox
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Components
      DEMO_TITLE: Checkbox
- assertVisible: "Checked: OFF"
# Real interaction: tap the native checkbox itself.
- tapOn: "Accept"
- assertVisible: "Checked: ON"
- tapOn: "Accept"
- assertVisible: "Checked: OFF"
# Programmatic path: buttons drive the same state.
- tapOn: "Check"
- assertVisible: "Checked: ON"
- tapOn: "Uncheck"
- assertVisible: "Checked: OFF"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Components
