# Tests ScrollView reveals rows that started off-screen after scrolling.
#
# Demo screen: examples/e2e-suite/app/screens/components/scroll_view.py
# Source under test: src/pythonnative/components.py :: ScrollView
#
# The demo's inner ScrollView is intentionally small (200 dp) — that's
# what's being tested — and it sits near the top of the screen, *not*
# in the middle. Maestro's ``scrollUntilVisible`` always swipes from
# the screen center, which lands below this scroll container and never
# scrolls it. The recommended Maestro pattern for non-fullscreen
# scrollables is a custom swipe loop with explicit coordinates that
# stay inside the scroll container's bounds. See:
#   https://docs.maestro.dev/examples/recipes/custom-scrolling-for-screen-fragments
#
# Per-swipe scroll travel is platform-dependent — Android's
# ``NestedScrollView`` flings more aggressively per gesture than iOS's
# ``UIScrollView``, so a fixed ``times: N`` overshoots on one platform
# and undershoots on the other. We loop with ``while: notVisible``
# instead, which exits as soon as ``ScrollRow 20`` enters the viewport
# regardless of how many swipes that took on this platform. Swipes are
# kept small (10% of screen height) so a single fling can't shoot
# past row 20.
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Components
      DEMO_TITLE: ScrollView
- assertVisible: "ScrollRow 1"
- repeat:
    times: 15
    while:
      notVisible: "ScrollRow 20"
    commands:
      - swipe:
          start: 50%, 20%
          end: 50%, 10%
          duration: 500
- assertVisible: "ScrollRow 20"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Components
