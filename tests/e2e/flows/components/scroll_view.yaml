# Tests ScrollView reveals rows that started off-screen after scrolling.
#
# Demo screen: examples/e2e-suite/app/screens/components/scroll_view.py
# Source under test: src/pythonnative/components.py :: ScrollView
#
# The demo sizes the inner ScrollView (~400 dp) so it overlaps the
# vertical center of the screen on both the iOS and Android CI
# emulators. That lets us use Maestro's standard ``scrollUntilVisible``
# (which always swipes from the screen center); its built-in
# adaptive swiping handles per-platform fling differences automatically
# and uses a single, viewport-aware visibility check, which avoids the
# tree-vs-viewport mismatch we hit with a custom ``while: notVisible``
# loop on Android API 31 (where off-screen ``NestedScrollView``
# children can be present in the accessibility tree even though
# clipped, causing the loop to exit before the row is actually in the
# viewport).
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Components
      DEMO_TITLE: ScrollView
- assertVisible: "ScrollRow 1"
- assertVisible: "Scrolled: OFF"
# Target the last row: the inner box is a fixed 400 dp on every device, so
# the early rows (~1-21) are on-screen without scrolling. Asserting a row
# that *is* already visible would let Maestro short-circuit with zero
# swipes (it does exactly that for "ScrollRow 20" on iOS), and then
# on_scroll never fires. The last row must land beyond the *physical
# screen* (not just the 400 dp box): clipped ScrollView children keep
# their content-coordinate accessibility frames, and Maestro treats
# anything within the screen bounds as visible, so the demo renders 60
# rows to push the last one past every simulator's screen height.
- scrollUntilVisible:
    element: "ScrollRow 60"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 100
    centerElement: false
- assertVisible: "ScrollRow 60"
# on_scroll fired during the swipe(s), flipping the outer readout.
- assertVisible: "Scrolled: ON"
# The inner scroll's height plus the "Scrolled" readout push the demo's
# "Back to list" button (rendered below the card by demo_screen) below the
# fold on Android's shorter emulator viewport. close_demo taps it without
# scrolling, so surface it first here. Android's NestedScrollView bubbles
# the over-scroll to the outer page once the inner list bottoms out. iOS
# keeps the button on-screen (its UIScrollView doesn't bubble to the parent,
# and close_demo already worked there), so this is scoped to Android only.
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            text: "Back to list"
          direction: DOWN
          timeout: 20000
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Components
