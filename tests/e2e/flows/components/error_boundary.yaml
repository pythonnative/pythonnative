# Tests ErrorBoundary catches a render error and shows the fallback.
#
# Demo screen: examples/e2e-suite/app/screens/components/error_boundary.py
# Source under test: src/pythonnative/components/structural.py :: ErrorBoundary
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Components
      DEMO_TITLE: ErrorBoundary
- assertVisible: "Caught render error"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Components
