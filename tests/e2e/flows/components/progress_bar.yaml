# Tests ProgressBar advances by 25% and resets, scrolling to the controls
# when the static examples put them below the viewport.
#
# Demo screen: examples/e2e-suite/app/screens/components/progress_bar.py
# Source under test: src/pythonnative/components/controls.py :: ProgressBar
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Components
      DEMO_TITLE: ProgressBar
- assertVisible: "Progress: 25%"
- scrollUntilVisible:
    element:
      text: "Advance"
    direction: DOWN
    timeout: 20000
- tapOn: "Advance"
- assertVisible: "Progress: 50%"
- tapOn: "Reset"
- assertVisible: "Progress: 0%"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Components
