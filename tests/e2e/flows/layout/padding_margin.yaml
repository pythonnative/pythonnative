# Tests padding / margin labels render at different sizes.
#
# Demo screen: examples/e2e-suite/app/screens/layout/padding_margin.py
# Source under test: src/pythonnative/layout.py, src/pythonnative/style.py
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Layout
      DEMO_TITLE: Padding & margin
- assertVisible: "padding-4"
- assertVisible: "padding-12"
- assertVisible: "padding-24"
- assertVisible: "margin-0"
- assertVisible: "margin-12"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Layout
