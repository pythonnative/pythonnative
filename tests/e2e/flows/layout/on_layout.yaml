# Tests on_layout delivers a LayoutEvent with the computed frame after each
# layout pass, and that the element's ViewHandle.frame matches it.
#
# Demo screen: examples/e2e-suite/app/screens/layout/on_layout.py
# Source under test: src/pythonnative/components/_base.py :: on_layout, src/pythonnative/handles.py :: ViewHandle
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Layout
      DEMO_TITLE: on_layout
- extendedWaitUntil:
    visible: "Measured: 120x60"
    timeout: 5000
- assertVisible: "Handle frame: 120x60"
- tapOn: "Widen box"
- extendedWaitUntil:
    visible: "Measured: 200x60"
    timeout: 5000
- assertVisible: "Handle frame: 200x60"
- tapOn: "Shrink box"
- extendedWaitUntil:
    visible: "Measured: 120x60"
    timeout: 5000
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Layout
