# pn.WebSocket and multipart fetch against servers the demo runs on localhost.
#
# Demo screen: examples/e2e-suite/app/screens/capabilities/websocket.py
# Source under test: src/pythonnative/websocket.py, src/pythonnative/net.py
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Capabilities
      DEMO_TITLE: WebSocket
- extendedWaitUntil:
    visible: 'Echoed: hello from Python / {"value": 42}'
    timeout: 10000
- extendedWaitUntil:
    visible: "Close code: 1000"
    timeout: 5000
- extendedWaitUntil:
    visible: "Uploaded: 2 parts"
    timeout: 10000
- assertVisible: "Progress: 100"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Capabilities
