# Tests border / radius / shadow styling renders and border_style draws
# solid, dashed, and dotted boxes.
#
# Demo screen: examples/e2e-suite/app/screens/styling/borders_shadows.py
# Source under test: src/pythonnative/style.py :: border_*, shadow_*, border_style
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Styling
      DEMO_TITLE: Borders & shadows
- assertVisible: "border-shadow-card"
- assertVisible: "solid-border"
- assertVisible: "dashed-border"
- assertVisible: "dotted-border"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Styling
