# Tests the transform style renders translate / rotate / scale boxes and the
# 3D operations (perspective + rotate_x / rotate_y, skew_x / skew_y).
#
# Demo screen: examples/e2e-suite/app/screens/styling/transform.py
# Source under test: src/pythonnative/style.py :: TransformSpec
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Styling
      DEMO_TITLE: Transforms
- assertVisible: "translate"
- assertVisible: "rotate"
- assertVisible: "scale"
- assertVisible: "rotate_x"
- assertVisible: "rotate_y"
- assertVisible: "skew"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Styling
