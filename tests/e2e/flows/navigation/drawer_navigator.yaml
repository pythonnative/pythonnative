# Tests the nested Drawer navigator switches screens via explicit nav buttons.
#
# Demo screen: examples/e2e-suite/app/screens/navigation/drawer_navigator.py
# Source under test: src/pythonnative/navigation.py :: create_drawer_navigator
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Navigation
      DEMO_TITLE: Drawer Navigator
# The nested navigator's first screen renders through an extra
# Provider/context hop, which can land a beat after the page header on
# a slow CI runner — wait for it instead of asserting immediately.
- extendedWaitUntil:
    visible: "Drawer screen One"
    timeout: 30000
- tapOn: "Go to Two"
- assertVisible: "Drawer screen Two"
- tapOn: "Go to One"
- assertVisible: "Drawer screen One"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Navigation
