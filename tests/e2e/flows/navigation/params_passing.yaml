# Tests use_route reads navigation params; navigating with new params updates them.
#
# Demo screen: examples/e2e-suite/app/screens/navigation/params_passing.py
# Source under test: src/pythonnative/navigation.py :: use_route, NavigationHandle.navigate
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Navigation
      DEMO_TITLE: Route Params
- assertVisible: "Param 'value': (none)"
- tapOn: "Push value=alpha"
- assertVisible: "Param 'value': alpha"
- tapOn: "Push value=beta"
- assertVisible: "Param 'value': beta"
# Each ``Push value=…`` pushes a new ``params_passing`` entry onto
# the stack, so two pops are needed to drain that history before
# the standard close_demo tap pops out of the demo to the category.
- tapOn: "Back to list"
- assertVisible: "Param 'value': alpha"
- tapOn: "Back to list"
- assertVisible: "Param 'value': (none)"
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Navigation
