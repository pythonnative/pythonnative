# Tests the nested Tab navigator switches tabs and shows their body.
#
# Demo screen: examples/e2e-suite/app/screens/navigation/tab_navigator.py
# Source under test: src/pythonnative/navigation/navigators.py :: create_tab_navigator
#
# The tap target (the TabBar) is persistent across switches, so taps are
# reliable. We `extendedWaitUntil` rather than assert immediately only
# because a state-driven re-render is committed on the next run-loop turn,
# so the new tab body appears a beat after the tap.
appId: ${APP_ID}
---
- runFlow:
    file: ../../helpers/open_demo.yaml
    env:
      CATEGORY: Navigation
      DEMO_TITLE: Tab Navigator
- extendedWaitUntil:
    visible: "Tab Alpha body"
    timeout: 30000
- tapOn: "Beta"
- extendedWaitUntil:
    visible: "Tab Beta body"
    timeout: 10000
- tapOn: "Gamma"
- extendedWaitUntil:
    visible: "Tab Gamma body"
    timeout: 10000
- tapOn: "Alpha"
- extendedWaitUntil:
    visible: "Tab Alpha body"
    timeout: 10000
- runFlow:
    file: ../../helpers/close_demo.yaml
    env:
      CATEGORY: Navigation
