appId: ${APP_ID}
---
# Verify the home screen renders correctly and the counter works.
- launchApp
- extendedWaitUntil:
    visible: "Hello from PythonNative Demo!"
    timeout: 30000
- assertVisible: "Tapped 0 times"
- assertVisible: "Tap me"
- assertVisible: "View Showcase"
- tapOn: "Tap me"
- assertVisible: "Tapped 1 times"
- tapOn: "Tap me"
- assertVisible: "Tapped 2 times"
