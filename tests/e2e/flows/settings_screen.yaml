appId: ${APP_ID}
---
# Switch to the Settings screen and verify Platform info + Alert API.
- launchApp
- extendedWaitUntil:
    visible: "Hello from PythonNative Demo!"
    timeout: 30000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 10000
- assertVisible: "PythonNative v"
- assertVisible: "Show alert"
- tapOn: "Show alert"
- extendedWaitUntil:
    visible: "Hello!"
    timeout: 5000
- assertVisible: "This is a native alert dialog."
- tapOn: "OK"
