name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to recover (leave empty for a new release)
        type: string
        required: false

# Serialize the entire release, including manual recoveries and uploads.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'pythonnative/pythonnative' && github.ref == 'refs/heads/main'
    name: Select release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      # PSR writes its own `tag` output even when released=false. Forward
      # only outputs we explicitly set after selecting a source commit.
      tag: ${{ steps.select.outputs.release_tag }}
      commit: ${{ steps.select.outputs.release_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.13'
      - name: Create a version or select an existing release
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$RECOVERY_TAG" ]; then
            # Only published release tags from main can be recovered.
            [[ "$RECOVERY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            commit=$(git rev-parse --verify "refs/tags/$RECOVERY_TAG^{commit}")
            git merge-base --is-ancestor "$commit" origin/main
            gh release view "$RECOVERY_TAG" --json isDraft --jq '.isDraft' | grep -qx false
            tag="$RECOVERY_TAG"
          else
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            # GitPython 3.1.60 removed Actor.name_email_regex, which PSR
            # 9.21.2 still uses. Keep this constraint until PSR is upgraded.
            uv tool install "python-semantic-release==9.21.2" --with "gitpython<3.1.60"
            tags_before=$(git tag | wc -l)
            semantic-release -v version
            tags_after=$(git tag | wc -l)
            if [ "$tags_after" -eq "$tags_before" ]; then
              echo "No new release. To resume an upload, run this workflow with its existing tag."
              exit 0
            fi
            tag=$(git describe --tags --exact-match HEAD)
            commit=$(git rev-parse HEAD)
          fi
          # Check the tag against package metadata without importing/building it.
          git show "$commit:pyproject.toml" > "$RUNNER_TEMP/release-project.toml"
          RELEASE_TAG="$tag" python -c 'import os, pathlib, tomllib; data = tomllib.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "release-project.toml").read_text()); assert os.environ["RELEASE_TAG"] == "v" + data["project"]["version"]'
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_commit=$commit" >> "$GITHUB_OUTPUT"

  distributions:
    name: Build release distributions
    needs: release
    if: needs.release.outputs.tag != '' && needs.release.outputs.commit != ''
    uses: ./.github/workflows/wheels.yml
    with:
      source-ref: ${{ needs.release.outputs.commit }}

  publish:
    name: Publish distributions
    needs: [release, distributions]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.13'
      - name: Preserve release assets for resumable publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: uv run --no-project python scripts/release-assets.py "$RELEASE_TAG" dist
      - name: Validate the exact files to publish
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          uv run --no-project --with packaging python scripts/check-distributions.py dist --version "${RELEASE_TAG#v}"
          uvx twine check --strict dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # PythonNative Go, the prebuilt dev client, ships as release assets that
  # `pn go` downloads for the matching version (RFC 0006). Its builds run
  # after PyPI publishing so a toolchain hiccup never blocks the package.
  go:
    name: Build PythonNative Go (${{ matrix.platform }})
    needs: [release, publish]
    if: needs.release.outputs.tag != '' && needs.release.outputs.commit != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            runner: macos-15
          - platform: android
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: '3.13'
      - name: Set up Java 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Gradle
        if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@v4
      - name: Install PythonNative
        run: uv sync --locked
      - name: Build and package
        run: uv run python scripts/build-go.py --platform ${{ matrix.platform }} --out go-dist
      - uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.platform }}
          path: go-dist/
          if-no-files-found: error

  go-assets:
    name: Attach PythonNative Go to the release
    needs: [release, go]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          pattern: go-*
          path: go-dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.13'
      - name: Write checksums
        run: uv run python scripts/build-go.py --checksums go-dist
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" go-dist/* --clobber
