name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv (Python ${{ matrix.python-version }})
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Format check (Black)
        run: uv run black --check src examples tests

      - name: Type check (MyPy)
        run: uv run mypy

      # Produces the sdist and wheel through the setuptools backend. Note
      # this builds but does not install them, so the previous non-editable
      # install smoke test is not replaced.
      - name: Build package
        run: uv build

      - name: Run tests
        run: uv run pytest -q

  # The Swift half of the rendering core: decoders, component managers,
  # gestures, and module promises run under XCTest on a simulator.
  native-ios:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run PythonNativeKit tests
        working-directory: src/pythonnative/templates/ios_template/PythonNativeKit
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme PythonNativeKit \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
            -derivedDataPath "$RUNNER_TEMP/pnkit" \
            -quiet

  # The Kotlin half has no Chaquopy dependency, so plain JUnit covers it.
  native-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run pythonnative module tests
        working-directory: src/pythonnative/templates/android_template
        run: ./gradlew :pythonnative:testDebugUnitTest --no-daemon
