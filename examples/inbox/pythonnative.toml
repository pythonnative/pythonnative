[app]
id = "dev.pythonnative.inbox"
name = "inbox"
display_name = "PythonNative Inbox"
version = "0.1.0"
build = 1
python_version = "3.13"
entry_point = "app/main.py"

[ios]
deployment_target = "13.0"

[android]
min_sdk = 24
target_sdk = 34
abi_filters = ["arm64-v8a", "x86_64"]

[plugins]
paths = ["native"]
