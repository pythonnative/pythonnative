# PythonNative hello-world demo configuration.

[app]
id = "com.pythonnative.demo"
name = "hello_world"
display_name = "PythonNative Demo"
version = "1.0.0"
build = 1
python_version = "3.11"
orientation = "portrait"
entry_point = "app/main.py"

[requirements]
packages = ["emoji"]

[ios]
deployment_target = "13.0"

[android]
min_sdk = 24
target_sdk = 34
abi_filters = ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
