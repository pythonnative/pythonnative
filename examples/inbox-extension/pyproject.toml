[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pn-inbox-extension"
version = "0.1.0"
requires-python = ">=3.13"
description = "PythonNative's packaged component and module SDK acceptance extension"

[project.entry-points."pythonnative.plugins"]
inbox = "inbox_extension.native"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inbox_extension.native" = ["*.json", "ios/*.swift", "android/**/*.kt"]
